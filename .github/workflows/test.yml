name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        cache: true

    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH=$Qt6_DIR

    - name: Build Module
      run: cmake --build build --target prayerTimesModuleplugin --parallel

    - name: Build Tests
      run: cmake --build build --target tst_qmlPrayerTimes --parallel

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: build/

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.0'
        cache: true

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: build

    - name: Verify downloaded artifacts
      run: |
        echo "=== Listing downloaded artifacts ==="
        ls -la build/
        echo ""
        echo "=== Checking test executable ==="
        if [ -f build/tst_qmlPrayerTimes ]; then
          echo "✓ Test executable found"
          file build/tst_qmlPrayerTimes
        else
          echo "✗ Test executable NOT found"
          echo "Searching for test executable:"
          find build -name "tst_qmlPrayerTimes" -o -name "tst_*" | head -20
          exit 1
        fi
        echo ""
        echo "=== Checking QML module ==="
        if [ -d build/src/qmlPrayerTimes ]; then
          echo "✓ QML module directory found"
          ls -la build/src/qmlPrayerTimes/
        else
          echo "✗ QML module directory NOT found"
          find build -name "*.so" -o -name "qmldir" | head -20
        fi

    - name: Make test executable
      run: chmod +x build/tst_qmlPrayerTimes

    - name: Verify CTest configuration
      run: |
        cd build
        echo "=== CTest Configuration ==="
        ctest --show-only=json-v1 || ctest -N
        echo ""
        echo "=== Environment Check ==="
        echo "QML_IMPORT_PATH would be: $PWD/src/qmlPrayerTimes"

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --verbose --output-junit test-results.xml
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: always()
      with:
        report_paths: 'build/test-results.xml'
        check_name: 'Test Results'
        detailed_summary: true
        include_passed: true

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/Testing/
